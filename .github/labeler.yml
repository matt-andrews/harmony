## publishable areas
"area: core":
  - changed-files:
      - any-glob-to-any-file: "src/**"
      - any-glob-to-any-file: "web/**"

## non-publishable areas
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - ".assets/**"
          - "README.md"
          - "LICENSE-MIT"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"