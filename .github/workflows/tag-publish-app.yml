name: Publish - App

on:
  push:
    tags:
      - "app/v*"

permissions:
  contents: read

jobs:
  pr-test:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-test.yml

  publish-app:
    needs:
      - pr-test

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#app/v}"
          echo "image_version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_version=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "package_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PACKAGE_VERSION=${{ steps.version.outputs.package_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harmony:${{ steps.version.outputs.image_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/harmony:${{ steps.version.outputs.major_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/harmony:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/harmony
          readme-filepath: ./README.md

  build-desktop:
    name: Build desktop exe (Windows)
    needs:
      - pr-test

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The server embeds web/dist at compile time, so the frontend must exist first.
      - name: Build frontend
        run: |
          npm ci --prefix web --no-fund --no-audit
          npm run build --prefix web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Build desktop
        run: cargo build --release --locked -p harmony-desktop

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/harmony-desktop.exe dist/harmony-desktop-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: harmony-desktop-windows-x64
          path: dist/harmony-desktop-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [ publish-app, build-desktop ]
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release notes
        uses: matt-andrews/auto-release@v1
        with:
          tag: ${{ github.ref_name }}
          area_labels: "area: core"
          make_latest: true

      - uses: actions/download-artifact@v8
        with:
          name: harmony-desktop-windows-x64
          path: dist

      - name: Attach desktop exe to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/harmony-desktop-windows-x64.exe --clobber