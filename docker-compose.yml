services:
  harmony:
    build: .
    image: harmony:local
    container_name: harmony
    # HARMONY_STORAGE comes from the gitignored .env file. Either:
    #   HARMONY_STORAGE=sas:https://<acct>.blob.core.windows.net/harmony?<sas>   (Azure Blob)
    #   HARMONY_STORAGE=file:/data                                               (this mounted folder)
    env_file: .env
    environment:
      # Must listen on all interfaces inside the container; overrides .env.
      HARMONY_BIND: 0.0.0.0:8080
    volumes:
      - ./data:/data
    ports:
      - "31415:8080"
    restart: unless-stopped
